<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarah Boyle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 56px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    p {
      color: #6b7280;
      margin-bottom: 40px;
      font-size: 1rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    a.btn {
      display: block;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #1a1a1a;
      color: white;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sarah Boyle</h1>
    <p>Documents available for download below.</p>
    <div class="links">
      <a class="btn btn-primary" href="Sarah Boyle Resume .pdf" download>Download Resume</a>
      <a class="btn btn-secondary" href="Cover Letter Dashdot (1).pdf" download>Download Cover Letter</a>
    </div>
  </div>
</body>
</html>
